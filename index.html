<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">

  <title>My Private Space</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background: #f5f7fb;
    }

    main {
      width: min(100%, 700px);
    }

    .card {
      background: white;
      border: 1px solid #e6eaf2;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 16px 48px #24304a12;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.65rem;
    }

    p {
      color: #667085;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 650;
      font-size: .94rem;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cfd6e2;
      border-radius: 10px;
      font: inherit;
      color: inherit;
      background: white;
    }

    input:focus {
      outline: 3px solid #dfe7ff;
      border-color: #536dfe;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: #465fff;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .secondary {
      background: #edf0f7;
      color: #27324a;
    }

    .hidden {
      display: none !important;
    }

    .message {
      min-height: 1.5em;
      margin: 12px 0 0;
      font-size: .94rem;
    }

    .message.error {
      color: #b42318;
    }

    .message.success {
      color: #067647;
    }

    /* =========================
       DEMO 2 PAGE
    ========================= */

    #demo-page {
      background-color: hwb(0 69% 10%);
      font-family: monospace;
      font-size: 20px;
      color: black;
      min-height: 100vh;
      padding: 30px 20px;
      border-radius: 18px;
    }

    #demo-page marquee {
      color: whitesmoke;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
    }

    #demo-page mark {
      font-family:
        'Lucida Sans',
        'Lucida Sans Regular',
        'Lucida Grande',
        'Lucida Sans Unicode',
        Geneva,
        Verdana,
        sans-serif;
    }

    #demo-page .demo-title {
      font-size: 8px;
      font-family:
        'Trebuchet MS',
        'Lucida Sans Unicode',
        'Lucida Grande',
        'Lucida Sans',
        Arial,
        sans-serif;
      color: #005ff0;
    }

    #demo-page .demo-text {
      font-family: Arial, Helvetica, sans-serif;
    }

    #demo-page input {
      margin-top: 10px;
      display: block;
    }

    #demo-page .demo-button {
      margin-top: 10px;
      background: #005ff0;
      color: white;
    }
  </style>
</head>

<body>

  <main>

    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <section class="card" id="auth-view">

      <h1 id="auth-title">Sign in</h1>

      <p id="auth-description">
        Sign in to open your private space.
      </p>

      <form id="auth-form">

        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="8"
          required
        >

        <div class="actions">

          <button
            id="auth-submit"
            type="submit">
            Sign in
          </button>

          <button
            id="mode-toggle"
            class="secondary"
            type="button">
            Create account
          </button>

        </div>

      </form>

      <p
        id="auth-message"
        class="message"
        role="status"
        aria-live="polite">
      </p>

    </section>


    <!-- =========================
         DEMO 2 PAGE
         THIS APPEARS AFTER LOGIN
    ========================== -->

    <section
      id="demo-page"
      class="hidden">

      <marquee>
        HELLO THIS IS HARSHA REDDY
        YOU KNOWN AS <b><i>HR</i></b>
      </marquee>

      <h1 class="demo-title">
        <mark>CEO</mark>
        OF THE GOOGLE
      </h1>

      <p class="demo-text">
        hello this is harsha reddy you known me as student
        in prathibha junior college
        and i also coded some of login pages before 2 years
      </p>


      <!-- Original form from 1.html -->

      <form id="demo-form">

        <input
          type="password"
          id="demo-password"
          placeholder="Password">

        <input
          type="email"
          id="demo-email"
          placeholder="Email">

        <button
          type="submit"
          class="demo-button">
          sub
        </button>

      </form>


      <div class="actions">

        <button
          id="logout-button"
          class="secondary"
          type="button">
          Sign out
        </button>

      </div>

    </section>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      'https://ftmvbqaeicfwhhuggldw.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_zW8MLdOKg51igV6JKffNaw_Qi28NGd8';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* =========================
       ELEMENTS
    ========================== */

    const authView =
      document.querySelector('#auth-view');

    const demoPage =
      document.querySelector('#demo-page');

    const authForm =
      document.querySelector('#auth-form');

    const authMessage =
      document.querySelector('#auth-message');

    const modeToggle =
      document.querySelector('#mode-toggle');

    const authSubmit =
      document.querySelector('#auth-submit');

    let createMode = false;


    /* =========================
       MESSAGE
    ========================== */

    function setMessage(
      element,
      text,
      isError = false
    ) {

      element.textContent = text;

      element.className =
        `message${text
          ? (isError ? ' error' : ' success')
          : ''}`;
    }


    /* =========================
       SHOW LOGIN
    ========================== */

    function showLogin() {

      authView.classList.remove('hidden');

      demoPage.classList.add('hidden');
    }


    /* =========================
       SHOW DEMO PAGE
    ========================== */

    function showDemoPage() {

      authView.classList.add('hidden');

      demoPage.classList.remove('hidden');
    }


    /* =========================
       CREATE ACCOUNT / LOGIN MODE
    ========================== */

    modeToggle.addEventListener(
      'click',
      () => {

        createMode = !createMode;

        document.querySelector('#auth-title')
          .textContent =
          createMode
            ? 'Create account'
            : 'Sign in';

        document.querySelector('#auth-description')
          .textContent =
          createMode
            ? 'Create your account, then use it to sign in.'
            : 'Sign in to open your private space.';

        authSubmit.textContent =
          createMode
            ? 'Create account'
            : 'Sign in';

        modeToggle.textContent =
          createMode
            ? 'Back to sign in'
            : 'Create account';

        document.querySelector('#password')
          .autocomplete =
          createMode
            ? 'new-password'
            : 'current-password';

        setMessage(authMessage, '');
      }
    );


    /* =========================
       LOGIN
    ========================== */

    authForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();

        authSubmit.disabled = true;

        setMessage(authMessage, '');

        const email =
          document.querySelector('#email')
            .value
            .trim();

        const password =
          document.querySelector('#password')
            .value;

        try {

          const result =
            createMode

              ? await db.auth.signUp({
                  email,
                  password,
                  options: {
                    emailRedirectTo:
                      window.location.href
                  }
                })

              : await db.auth.signInWithPassword({
                  email,
                  password
                });


          if (result.error) {
            throw result.error;
          }


          /* =========================
             SUCCESSFUL LOGIN
             OPEN DEMO 2 PAGE
          ========================== */

          if (
            result.data.user
          ) {

            showDemoPage();

          }

        }

        catch (error) {

          setMessage(
            authMessage,
            error.message ||
              'Authentication failed. Please try again.',
            true
          );

        }

        finally {

          authSubmit.disabled = false;

        }

      }
    );


    /* =========================
       DEMO FORM
    ========================== */

    document.querySelector('#demo-form')
      .addEventListener(
        'submit',
        (event) => {

          event.preventDefault();

          alert('Demo form submitted.');

        }
      );


    /* =========================
       SIGN OUT
    ========================== */

    document.querySelector('#logout-button')
      .addEventListener(
        'click',
        async () => {

          const { error } =
            await db.auth.signOut();

          if (error) {

            alert(error.message);

          }
          else {

            showLogin();

          }

        }
      );


    /* =========================
       AUTH STATE
    ========================== */

    db.auth.onAuthStateChange(
      (_event, session) => {

        if (session?.user) {

          showDemoPage();

        }
        else {

          showLogin();

        }

      }
    );


    /* =========================
       CHECK EXISTING SESSION
    ========================== */

    db.auth.getSession()
      .then(({ data, error }) => {

        if (error) {

          setMessage(
            authMessage,
            error.message,
            true
          );

          return;
        }

        if (data.session?.user) {

          showDemoPage();

        }

      });

  </script>

</body>

</html>
